name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - id: version
        name: Read the emela version from Pome.toml
        run: echo "emela=$(sed -n 's/^emela = "\(.*\)"$/\1/p' Pome.toml)" >> "$GITHUB_OUTPUT"
      - uses: emela-lang/setup-emela@v1
        with:
          version: ${{ steps.version.outputs.emela }}
      # The js target runs on node.
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      # The wasm target runs the WASI 0.3 component with wasmtime 49 or newer.
      - uses: bytecodealliance/actions/wasmtime/setup@v1
        with:
          version: 49.0.3
      - name: Install
        run: emela pome install
      - name: Format
        run: emela fmt --check
      - name: Check
        run: emela check
      - name: Test on js, native and wasm
        run: |
          for target in js native wasm; do
            out="$(emela test --target "$target")"
            echo "$out"
            # A compiler that does not read `test/` would pass with no tests.
            if echo "$out" | grep -q '^running 0 tests'; then
              echo "::error::no tests ran on $target"
              exit 1
            fi
          done

  # Every .emel of emela-lang/emela, at the tag of the release Graft is built with:
  # - M1: lexes into tokens that concatenate back to the file
  # - Graft's tokens, syntax tree and formatted output equal those of the reference implementation
  #   (tools/oracle), except for scripts/known-differences.txt
  corpus:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: version
        name: Read the emela version from Pome.toml
        run: echo "emela=$(sed -n 's/^emela = "\(.*\)"$/\1/p' Pome.toml)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          repository: emela-lang/emela
          ref: v${{ steps.version.outputs.emela }}
          path: corpus/emela
      - uses: emela-lang/setup-emela@v1
        with:
          version: ${{ steps.version.outputs.emela }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install
        run: emela pome install
      - name: Round-trip the corpus
        run: scripts/roundtrip.sh corpus/emela
      - name: Check that the oracle is built from the same release
        run: |
          tag='tag = "v${{ steps.version.outputs.emela }}"'
          if ! grep -qF "$tag" tools/oracle/Cargo.toml; then
            echo "::error file=tools/oracle/Cargo.toml::emela-syntax must be at $tag, as emela in Pome.toml"
            exit 1
          fi
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: tools/oracle
      - name: Compare tokens with the reference
        run: scripts/compare.sh tokens corpus/emela
      - name: Compare syntax trees with the reference
        run: scripts/compare.sh tree corpus/emela
      - name: Compare formatted output with the reference
        run: scripts/compare.sh fmt corpus/emela
